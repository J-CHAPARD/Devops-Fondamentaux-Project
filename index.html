<!DOCTYPE html>
<html lang="fr">
<head>
        <title>Site Web Pokemon</title>
        <!-- CSS stylesheet -->
        <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
<main>
    <h1>Site Web **kemon</h1>
    <div class="group-card">
        <article class="card"> 
            <div class="group-type">
                <div class="type-icon type-ghost">Ghost</div>
                <div class="type-icon type-fairy">Fairy</div>
            </div>
            <h2>A Pika-tchu</h2>
            <div class="img-container">
                <img alt="A picture of a Pikatchu"
                        src="static/img/mimikyu.png" />
            </div>
            <p class="card-HP"><span>HP</span>55</p>
        </article>
        <article class="card">
            <div class="group-type">
                <div class="type-icon type-electric">Electric</div>
            </div>
            <h2>Not a Pika-tchu</h2>
            <div class="img-container">
                <img alt="Not a picture of a Pikatchu"
                        src="static/img/mimikyu-busted.png" />
            </div>
            <p class="card-HP"><span>HP</span>999</p>
        </article>
        <article class="card">
            <div class="group-type">
                <div class="type-icon type-ghost">Ghost</div>
                <div class="type-icon type-fairy">Fairy</div>
            </div>
            <h2>A lesser Pika-tchu</h2>
            <div class="img-container">
                <img alt="A picture of a lesser Pikatchu"
                        src="static/img/pikachu-gen1-jp.jpg" />
            </div>
            <p class="card-HP"><span>HP</span>35</p>
        </article>
        <article class="card">
            <div class="group-type">
                <div class="type-icon type-normal">Normal</div>
            </div>
            <h2>A ... Pika-tchu ?</h2>
            <div class="img-container">
                <img alt="Maybe a picture of a Pikatchu"
                        src="static/img/ditto-mimikyu.png" />
            </div>
            <p class="card-HP"><span>HP</span>48</p>
        </article>
        <article class="card">
            <div class="group-type">
                <div class="type-icon type-electric">Electric</div>
            </div>
            <h2>KILL IT WITH FIRE</h2>
            <div class="img-container">
                <img alt="A spawn of Hellfire"
                        src="static/img/pichu-gen2.jpg" />
            </div>
            <p class="card-HP"><span>HP</span>?$°#</p>
        </article>
    <!-- </div class="group-card"> -->
    </div>
</main>
</body>
</html>
